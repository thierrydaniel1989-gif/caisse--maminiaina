name: Build Caisse MAMINAINA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet
        run: |
          unzip -o Caisse_MAMINAINA_GitHub_APK.zip -d .
          cd Caisse_APK_Android
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer et préparer Android
        working-directory: Caisse_APK_Android
        run: |
          npm install
          npx cap add android

      - name: Installer le plugin imprimante
        working-directory: Caisse_APK_Android
        run: |
          mkdir -p android/app/src/main/java/com/maminaina/caisse
          cp android-plugin/src/main/java/com/maminaina/caisse/NetworkPrinterPlugin.java android/app/src/main/java/com/maminaina/caisse/
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = next(Path('android/app/src/main/java').rglob('MainActivity.java'))
          s = p.read_text()
          s = re.sub(r'^(package [^;]+;\s*)', r'\1\nimport com.maminaina.caisse.NetworkPrinterPlugin;\n', s, count=1, flags=re.M)
          s = s.replace('super.onCreate(savedInstanceState);', 'super.onCreate(savedInstanceState);\n        registerPlugin(NetworkPrinterPlugin.class);')
          p.write_text(s)
          m = Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          m.write_text(s)
          PY
          npx cap sync android

      - name: Compiler APK
        working-directory: Caisse_APK_Android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Caisse-MAMINAINA-APK
          path: Caisse_APK_Android/android/app/build/outputs/apk/debug/app-debug.apk
